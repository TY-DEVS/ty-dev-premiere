# ==============================================================================
# Staging Docker Compose Configuration - TY Dev Platform
# Target Subdomains: staging.ty-dev.fr, staging.ty-dev.tech, staging.ty-dev.site
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tydev-platform-staging
    restart: unless-stopped
    ports:
      - "${STAGING_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - APP_ENV=staging
      - NEXT_PUBLIC_APP_ENV=staging
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - SITE_URL=${SITE_URL:-https://staging.ty-dev.site}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://staging.ty-dev.site}
      - SMTP_HOST=${SMTP_HOST:-83.229.19.107}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-contact@ty-dev.site}
      - SMTP_PASS=${SMTP_PASS:-}
      - CONTACT_RECEIVER=${CONTACT_RECEIVER:-}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-6LfVxOgtAAAAAI2hMoinkz4lyf2KqmHmw_gBBRr2}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-6LfVxOgtAAAAAAooTxVUTMYVbIXtvx1N9zNUYOGF}
      - BLOG_ADMIN_TOKEN=${BLOG_ADMIN_TOKEN:-tydev_blog_admin_secret_key_2026}
    env_file:
      - path: .env.staging
        required: false
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - tydev-staging-network

networks:
  tydev-staging-network:
    name: tydev-staging-network
    driver: bridge
